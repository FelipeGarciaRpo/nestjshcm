name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─── HCM Mock Tests ──────────────────────────────────────────────────────────
  hcm-tests:
    name: HCM Mock Server Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: hcm/package-lock.json

      - name: Install HCM dependencies
        working-directory: hcm
        run: npm ci

      - name: Type check HCM
        working-directory: hcm
        run: npx tsc --noEmit

      - name: Run HCM tests
        working-directory: hcm
        run: npm test
        env:
          LATENCY_MIN_MS: 0
          LATENCY_MAX_MS: 0
          ERROR_RATE_PERCENT: 0

  # ─── NestJS Unit Tests ───────────────────────────────────────────────────────
  unit-tests:
    name: NestJS Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Run unit tests with coverage
        working-directory: server
        run: npm run test:coverage
        env:
          NODE_ENV: test
          WEBHOOK_SECRET: ci-test-secret
          HCM_BASE_URL: http://localhost:4000
          DATABASE_PATH: memory

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: server/coverage/
          retention-days: 7

  # ─── NestJS E2E Tests ────────────────────────────────────────────────────────
  e2e-tests:
    name: NestJS E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Run E2E tests
        working-directory: server
        run: npm run test:e2e
        env:
          NODE_ENV: test
          WEBHOOK_SECRET: ci-test-secret
          HCM_BASE_URL: http://localhost:4000
          DATABASE_PATH: memory

  # ─── Build Check ─────────────────────────────────────────────────────────────
  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-tests]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Build NestJS
        working-directory: server
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: server/dist/
          retention-days: 3